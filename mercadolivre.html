<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Mercado Livre | Alex Vieira</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }
    </style>
</head>

<body class="min-h-screen text-slate-200 flex flex-col items-center p-4 antialiased pb-20">

    <main class="w-full max-w-md flex flex-col mt-4 relative">
        <a href="javascript:history.back()"
            class="inline-flex items-center text-slate-400 hover:text-white transition-colors mb-6 text-sm font-medium">
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            Voltar para Links
        </a>

        <div class="flex flex-col items-center mb-8">
            <div class="bg-white p-2 rounded-2xl mb-3 shadow-lg shadow-yellow-500/20">
                <img src="img/logo_mercadolivre.png" alt="Logo Mercado Livre" class="w-16 h-16 object-contain">
            </div>
            <h1 class="text-xl font-bold text-white tracking-tight">Destaques Mercado Livre</h1>
        </div>

        <!-- Produto 1 -->
        <div class="product-card bg-slate-800/40 border border-slate-700/50 rounded-2xl overflow-hidden mb-4 backdrop-blur-md shadow-lg flex flex-row items-center p-3 gap-4">
            <div class="w-28 h-28 shrink-0 bg-white/5 rounded-xl flex items-center justify-center p-2 relative">
                <img src="img/prod9_img1.webp" class="w-full h-full object-contain" alt="Intercomunicador Ejeas Q8">
            </div>
            <div class="flex-1 flex flex-col justify-center">
                <h3 class="text-sm font-semibold text-slate-100 mb-3 line-clamp-2">📶 Intercomunicador Ejeas Q8</h3>
                <a href="https://meli.la/2GpNHqL" target="_blank" class="block w-full py-2.5 rounded-xl bg-[#ffe600] text-[#2d3277] text-center font-bold text-xs shadow-lg shadow-yellow-500/20 active:scale-[0.98] transition-transform">
                    🛒 Comprar
                </a>
            </div>
        </div>

        <!-- Produto 2 -->
        <div class="product-card bg-slate-800/40 border border-slate-700/50 rounded-2xl overflow-hidden mb-4 backdrop-blur-md shadow-lg flex flex-row items-center p-3 gap-4">
            <div class="w-28 h-28 shrink-0 bg-white/5 rounded-xl flex items-center justify-center p-2 relative">
                <img src="img/ml_prod2_img1.webp" class="w-full h-full object-contain" alt="Camera GoPro HERO13 Black">
            </div>
            <div class="flex-1 flex flex-col justify-center">
                <h3 class="text-sm font-semibold text-slate-100 mb-3 line-clamp-2">📷 Camera GoPro HERO13 Black</h3>
                <a href="https://meli.la/285G5Bu" target="_blank" class="block w-full py-2.5 rounded-xl bg-[#ffe600] text-[#2d3277] text-center font-bold text-xs shadow-lg shadow-yellow-500/20 active:scale-[0.98] transition-transform">
                    🛒 Comprar
                </a>
            </div>
        </div>

        <!-- Produto 3 -->
        <div class="product-card bg-slate-800/40 border border-slate-700/50 rounded-2xl overflow-hidden mb-4 backdrop-blur-md shadow-lg flex flex-row items-center p-3 gap-4">
            <div class="w-28 h-28 shrink-0 bg-white/5 rounded-xl flex items-center justify-center p-2 relative">
                <img src="img/ml_prod1_img1.webp" class="w-full h-full object-contain" alt="Carregador Turbo Xiaomi 100w">
            </div>
            <div class="flex-1 flex flex-col justify-center">
                <h3 class="text-sm font-semibold text-slate-100 mb-3 line-clamp-2">🔋Carregador Turbo Xiaomi 100w</h3>
                <a href="https://meli.la/2KpgpUK" target="_blank" class="block w-full py-2.5 rounded-xl bg-[#ffe600] text-[#2d3277] text-center font-bold text-xs shadow-lg shadow-yellow-500/20 active:scale-[0.98] transition-transform">
                    🛒 Comprar
                </a>
            </div>
        </div>

    </main>

    <div id="scrollMsg" class="fixed bottom-6 left-0 right-0 flex justify-center w-full z-50 transition-opacity duration-300 pointer-events-none">
        <div class="bg-[#00bfa5]/90 backdrop-blur-md text-white px-5 py-2.5 rounded-full font-semibold text-sm shadow-lg shadow-[#00bfa5]/30 animate-bounce pointer-events-auto">Deslize para ver mais 👇</div>
    </div>

    <!-- Script reduzido apenas para a função de Scroll -->
    <script>
        function verificarScroll() {
            const scrollMsg = document.getElementById('scrollMsg');
            if (!scrollMsg) return;
            const posicaoAtual = window.innerHeight + window.scrollY;
            const alturaTotal = document.body.offsetHeight;
            if (window.innerHeight >= alturaTotal || posicaoAtual >= alturaTotal - 100) {
                scrollMsg.style.opacity = '0'; scrollMsg.style.pointerEvents = 'none';
            } else {
                scrollMsg.style.opacity = '1'; scrollMsg.style.pointerEvents = 'auto';
            }
        }
        window.addEventListener('load', verificarScroll);
        window.addEventListener('scroll', verificarScroll);
    </script>
</body>

</html>
