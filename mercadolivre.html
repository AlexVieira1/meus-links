<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Mercado Livre | Alex Vieira</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }
    </style>
</head>

<body class="min-h-screen text-slate-200 flex flex-col items-center p-4 antialiased pb-20">

    <main class="w-full max-w-md flex flex-col mt-4 relative">
        <!-- Botão Voltar (Como deve ficar) -->
        <a href="javascript:history.back()"
            class="inline-flex items-center text-slate-400 hover:text-white transition-colors mb-6 text-sm font-medium">
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            Voltar para Links
        </a>

        <div class="flex flex-col items-center mb-8">
            <div class="bg-white p-2 rounded-2xl mb-3 shadow-lg shadow-yellow-500/20">
                <img src="img/logo_mercadolivre.png" alt="Logo Mercado Livre" class="w-16 h-16 object-contain">
            </div>
            <h1 class="text-xl font-bold text-white tracking-tight">Destaques Mercado Livre</h1>
        </div>

        <div class="product-card bg-slate-800/40 border border-slate-700/50 rounded-2xl overflow-hidden mb-5 backdrop-blur-md shadow-lg"
            data-images="img/ml_prod1_img1.jpg,img/ml_prod1_img2.jpg,img/ml_prod1_img3.jpg,img/ml_prod1_img4.jpg">
            <div class="relative bg-white/5 h-52 flex items-center justify-center p-4">
                <button
                    class="prev-btn absolute left-3 w-8 h-8 bg-slate-900/60 text-white rounded-full flex items-center justify-center backdrop-blur-sm z-10 shadow active:scale-90 transition-transform">❮</button>
                <img src="img/ml_prod1_img1.jpg" loading="lazy"
                    class="main-img h-44 w-auto object-contain drop-shadow-md transition-opacity duration-200"
                    alt="Produto">
                <button
                    class="next-btn absolute right-3 w-8 h-8 bg-slate-900/60 text-white rounded-full flex items-center justify-center backdrop-blur-sm z-10 shadow active:scale-90 transition-transform">❯</button>
            </div>
            <div class="p-4 pt-2 text-center">
                <div class="dots-container flex justify-center gap-1.5 mb-3">
                    <div class="w-1.5 h-1.5 rounded-full bg-slate-300 transition-colors duration-300"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-slate-600 transition-colors duration-300"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-slate-600 transition-colors duration-300"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-slate-600 transition-colors duration-300"></div>
                </div>
                <h3 class="text-sm font-semibold text-slate-100 mb-4 line-clamp-2">🔋Carregador Turbo Xiaomi 100w</h3>
                <a href="https://meli.la/2KpgpUK" target="_blank"
                    class="block w-full py-2.5 rounded-xl bg-[#ffe600] text-[#2d3277] font-bold text-sm shadow-lg shadow-yellow-500/20 active:scale-[0.98] transition-transform">
                    🛒 Comprar no Mercado Livre
                </a>
            </div>
        </div>

        <div class="product-card bg-slate-800/40 border border-slate-700/50 rounded-2xl overflow-hidden mb-5 backdrop-blur-md shadow-lg"
            data-images="img/ml_prod2_img1.png,img/ml_prod2_img2.png,img/ml_prod2_img3.png,img/ml_prod2_img4.png">
            <div class="relative bg-white/5 h-52 flex items-center justify-center p-4">
                <button
                    class="prev-btn absolute left-3 w-8 h-8 bg-slate-900/60 text-white rounded-full flex items-center justify-center backdrop-blur-sm z-10 shadow active:scale-90 transition-transform">❮</button>
                <img src="img/ml_prod2_img1.png" loading="lazy"
                    class="main-img h-44 w-auto object-contain drop-shadow-md transition-opacity duration-200"
                    alt="Produto">
                <button
                    class="next-btn absolute right-3 w-8 h-8 bg-slate-900/60 text-white rounded-full flex items-center justify-center backdrop-blur-sm z-10 shadow active:scale-90 transition-transform">❯</button>
            </div>
            <div class="p-4 pt-2 text-center">
                <div class="dots-container flex justify-center gap-1.5 mb-3">
                    <div class="w-1.5 h-1.5 rounded-full bg-slate-300 transition-colors duration-300"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-slate-600 transition-colors duration-300"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-slate-600 transition-colors duration-300"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-slate-600 transition-colors duration-300"></div>
                </div>
                <h3 class="text-sm font-semibold text-slate-100 mb-4 line-clamp-2">📷 Camera GoPro HERO13 Black</h3>
                <a href="https://meli.la/11aURRJ" target="_blank"
                    class="block w-full py-2.5 rounded-xl bg-[#ffe600] text-[#2d3277] font-bold text-sm shadow-lg shadow-yellow-500/20 active:scale-[0.98] transition-transform">
                    🛒 Comprar no Mercado Livre
                </a>
            </div>
        </div>
    </main>

    <div id="scrollMsg"
        class="fixed bottom-6 left-0 right-0 flex justify-center w-full z-50 transition-opacity duration-300 pointer-events-none">
        <div
            class="bg-[#00bfa5]/90 backdrop-blur-md text-white px-5 py-2.5 rounded-full font-semibold text-sm shadow-lg shadow-[#00bfa5]/30 animate-bounce pointer-events-auto">
            Deslize para ver mais 👇</div>
    </div>

    <script>
        // Esconder aviso de scroll
        function verificarScroll() {
            const scrollMsg = document.getElementById('scrollMsg');
            if (!scrollMsg) return;
            const posicaoAtual = window.innerHeight + window.scrollY;
            const alturaTotal = document.body.offsetHeight;
            if (window.innerHeight >= alturaTotal || posicaoAtual >= alturaTotal - 100) {
                scrollMsg.style.opacity = '0'; scrollMsg.style.pointerEvents = 'none';
            } else {
                scrollMsg.style.opacity = '1'; scrollMsg.style.pointerEvents = 'auto';
            }
        }
        window.addEventListener('load', verificarScroll);
        window.addEventListener('scroll', verificarScroll);

        // Troca de Imagem Ultraleve
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.product-card').forEach(card => {
                const imgElement = card.querySelector('.main-img');
                const prevBtn = card.querySelector('.prev-btn');
                const nextBtn = card.querySelector('.next-btn');
                const dots = card.querySelectorAll('.dots-container div');
                const imagesAttr = card.getAttribute('data-images');
                if (!imagesAttr) return;

                const images = imagesAttr.split(',').map(url => url.trim());
                let currentIndex = 0;

                const updateImage = () => {
                    imgElement.style.opacity = '0.3';
                    setTimeout(() => {
                        imgElement.src = images[currentIndex];
                        imgElement.style.opacity = '1';
                    }, 150);
                    dots.forEach((dot, idx) => {
                        dot.classList.toggle('bg-slate-300', idx === currentIndex);
                        dot.classList.toggle('bg-slate-600', idx !== currentIndex);
                    });
                };
                prevBtn.addEventListener('click', () => {
                    currentIndex = (currentIndex === 0) ? images.length - 1 : currentIndex - 1;
                    updateImage();
                });
                nextBtn.addEventListener('click', () => {
                    currentIndex = (currentIndex === images.length - 1) ? 0 : currentIndex + 1;
                    updateImage();
                });
            });
        });
    </script>
</body>

</html>
